<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinball Illusions</title>
    <meta
      name="description"
      content="Clean-room browser reconstruction of the Amiga AGA release of Pinball Illusions."
    />
    <link rel="stylesheet" href="./src/browser/styles.css" />
  </head>
  <body>
    <main class="cabinet">
      <!--
        The playfield window is 336 x 256 source pixels. Without HD assets it
        is magnified by a whole number only: the backing store is resized to
        that magnification in main.ts and the element is left at its natural
        size, so one source pixel is always an exact square block of device
        pixels. Once a table's HD master loads, the backing store becomes a
        fixed 4x supersample (1344 x 1024) and main.ts CSS-fits the element to
        the viewport instead — see fitCanvas.

        The same canvas carries the shell. The original's menu screens are
        320 x 256, so they are drawn into a 320-wide box centred in this one —
        eight pixels of surround each side, and not one of the decoded
        coordinates moved. See src/browser/shell-screens.ts.
      -->
      <canvas id="playfield" width="336" height="256" aria-label="Pinball playfield"></canvas>

      <p id="boot" class="boot">Loading…</p>

      <!--
        No key list here. A cabinet is the screen and nothing else, which is how
        the sibling Pinball Fantasies HD build presents itself, and the machine
        already names its own keys where the original does: the hint row on the
        attract and menu pages. Anything the shell does not say belongs in the
        README, not under the glass.
      -->
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
